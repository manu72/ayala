name = "ayala-ai-proxy"
main = "src/worker.ts"
compatibility_date = "2025-04-01"

# Secrets: wrangler secret put DEEPSEEK_API_KEY / OPENAI_API_KEY
# Kill switch: wrangler secret put AI_DISABLED (value 1) → every chat POST gets
# 503 ai_disabled; wrangler secret delete AI_DISABLED to restore. (A secret,
# not a [vars] entry, so the next deploy doesn't silently reset it.)
# Optional vars (defaults in code):
[vars]
DEEPSEEK_MODEL = "deepseek-flash"
OPENAI_MODEL = "gpt-4.1-mini-2025-04-14"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://manu72.github.io,https://ayalacats.app,https://www.ayalacats.app"

# Per-IP limits (CF-Connecting-IP, IPv6 per /64). Over the limit → 429
# rate_limited and the game plays scripted lines. period must be 10 or 60;
# namespace_id must be unique in the account (same id = shared counters).
# `wrangler deploy --dry-run` should list both under "Rate Limit".
[[ratelimits]]
name = "AI_RATE_LIMIT_BURST"
namespace_id = "41001"
  [ratelimits.simple]
  limit = 10
  period = 10

[[ratelimits]]
name = "AI_RATE_LIMIT_MINUTE"
namespace_id = "41002"
  [ratelimits.simple]
  limit = 30
  period = 60
